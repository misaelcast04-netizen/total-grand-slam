function draft(){return {seller:F.seller,store:F.store,date:nyToday(),week:weekOf(nyToday()),created_at:new Date().toISOString(),plan:F.plan,lines:F.plan?F.lines:0,tabs:F.tabs.slice(),hi:F.hi,autopay:F.ap,edge:F.edge,acc:Math.max(0,parseFloat(F.acc)||0)};}

function preview(){

  $("gain").textContent="+"+money(Math.max(0,after.pay.total-before.pay.total));
  var tip="";
  if(F.seller&&before.d===0)tip="🚀 Tu primera venta de hoy enciende el día: tu meta sube 1.";
  if(after.acLvl>before.acLvl)tip="🎉 Con esta venta llegas a "+LV[after.acLvl][1]+" en activaciones: todas pasan a "+Math.round(after.acRate*100)+"%";
  else if(after.apLvl>before.apLvl)tip="🎉 Con esta venta llegas a "+LV[after.apLvl][1]+" en autopago: todos pasan a "+money(after.apRate);
  else if(!before.accOk&&after.accOk)tip="🎉 Con esta venta llegas al mínimo de accesorios: cobras 5% de todo";

var saving=false;
async function save(){
  if(saving)return;
  var m=$("rmsg"), d=draft();m.className="msg err";
  if(!ME){logout();return;}
  if(!F.store){m.textContent="Escoge la tienda.";$("fT").focus();return;}
  if(F.order.replace(/\s/g,"").length<4){m.textContent="Escribe el número de orden.";$("fO").focus();return;}
  if(!d.plan&&!d.tabs.length&&!d.hi&&!d.autopay&&!d.edge&&!d.acc){m.textContent="Marca al menos un producto.";return;}
  if(!online){m.textContent="Sin conexión. Revisa el internet e intenta de nuevo.";return;}
  saving=true;$("launch").disabled=true;m.className="msg";m.textContent="Lanzando…";
  var before=calc(mySales(F.seller,d.week)), posBefore=rankPos(F.seller,d.week);
  var res=await sb.rpc("mt_add_sale",{p:{seller:F.seller,store:F.store,order:F.order,plan:d.plan,lines:d.lines,tabs:d.tabs,hi:d.hi,autopay:d.autopay,edge:d.edge,acc:d.acc},p_device:device,p_pin:ME.pin});
  saving=false;
  var st=res.error?"error":(res.data&&res.data.status);
  if(st==="bad_pin"||st==="no_pin"||st==="bad_seller"){logout("Tu PIN cambió o tu usuario no está activo. Entra de nuevo.");return;}
  var ERR={single_line:"Ese plan es de 1 sola línea. Para varias líneas usa $40, $55 o $65 con Add a Line.",dup:"Esa orden ya está registrada.",bad_order:"Revisa el número de orden.",empty:"Marca al menos un producto.",closed:"El reto no está activo hoy.",locked:"Demasiados intentos con PIN incorrecto. Espera 15 minutos.",bad_store:"Escoge una tienda válida.",bad_data:"Revisa los datos de la venta.",error:"No se pudo guardar. Intenta de nuevo."};
  if(st!=="ok"){$("launch").disabled=false;m.className="msg err";m.textContent=ERR[st]||ERR.error;return;}
  LS.set("mt-last",JSON.stringify({store:F.store}));
  d.id=res.data.id;d.date=res.data.date;d.week=res.data.week;d.verified=false;sales.unshift(d);
  mine.push({id:d.id,t:Date.now(),o:F.order});mine=mine.slice(-20);LS.set("mt-mine",JSON.stringify(mine));
  var after=calc(mySales(F.seller,d.week)), up=after.acLvl>before.acLvl||after.apLvl>before.apLvl;
  var cele=celebrate(before,after,posBefore,rankPos(F.seller,d.week),d.week);
  if(!cele)snd(up?"level":"launch");
  var keep="✓ Venta lanzada: +"+money(after.pay.total-before.pay.total)+(up?" · ¡Subiste de nivel!":"");
  var keepS=F.seller,keepT=F.store;resetF();F.seller=keepS;F.store=keepT;
  renderReg();var mm=$("rmsg");mm.className="msg ok";mm.textContent=keep;if(!cele)toast("🚀 ¡Venta lanzada!");
}
function rankPos(name,w){var st=standings(w);for(var i=0;i<st.length;i++)if(st[i].name===name)return i+1;return 0;}
function celebrate(b,a,pb,pa,w){
  var C=window.MTCelebrate;if(!C)return false;
  var first=(ME&&ME.name||"").split(" ")[0];
  if(a.acLvl===2&&b.acLvl<2){C.luna(first,"Activaciones a 12%");return true;}
  if(a.apLvl===2&&b.apLvl<2){C.luna(first,"Autopagos a $3.00 c/u");return true;}
  if(a.acLvl===1&&b.acLvl<1){C.orbit("Activaciones a 10%");return true;}
  if(a.apLvl===1&&b.apLvl<1){C.orbit("Autopagos a $2.50 c/u");return true;}
  if(a.accOk&&!b.accOk){C.fireworks("🎧 ¡Mínimo de accesorios!","Cobras 5% de todo");return true;}
  if(pb&&pa&&pa<pb){var st=standings(w),passed=st[pa]&&st[pa].name;
    C.fireworks(pa===1?"🏆 ¡Eres el #1!":"⬆️ ¡Subiste al #"+pa+"!",passed?"Pasaste a "+passed.split(" ")[0]:"Sigue así");return true;}
  return false;
}

  if(sub==="tiendas")h+=adminStores();
  else if(sub==="nomina")h+=adminPay();
  else if(sub==="auditoria")h+=adminAudit();
  else h+=adminSellers();
  h+='<div style="text-align:center;margin-top:12px"><button class="btn sm" id="logout">Cerrar admin</button></div>';
  $("v-admin").innerHTML=h;
  [].forEach.call(document.querySelectorAll("#v-admin [data-sub]"),function(b){b.onclick=function(){sub=b.dataset.sub;renderAdmin();};});
  $("logout").onclick=function(){adminPin=null;SS.set("mt-pin",null);if(!ME){showLogin();return;}renderAdmin();};
  bindAdmin();
}
function dayOfMonth(){var t=nyToday();return Math.min(30,Math.max(1,+t.slice(8,10)));}
function adminStores(){
  var day=dayOfMonth(),gold=0,plat=0,cash=0;
  var rows=stores.map(function(s){
    var a=storeMonth(s), proj=Math.round(a/day*30), st;
    if(!s.gold)st=["Sin meta","var(--mut)"];
    else if(s.plat&&proj>=s.plat){st=["Ruta Platinum","var(--txt)"];plat++;cash+=1000;}
    else if(proj>=s.gold){st=["Ruta Gold","var(--moon)"];gold++;cash+=500;}
    else st=["En riesgo","var(--red)"];
    return '<tr data-store="'+esc(s.name)+'"><td>'+esc(s.name)+'</td><td><b>'+a+'</b></td><td>'+proj+'</td><td><input data-f="gold" inputmode="numeric" value="'+(s.gold==null?"":s.gold)+'" aria-label="Gold '+esc(s.name)+'"></td><td><input data-f="plat" inputmode="numeric" value="'+(s.plat==null?"":s.plat)+'" aria-label="Platinum '+esc(s.name)+'"></td><td><input data-f="ms" inputmode="numeric" placeholder="—" value="'+(s.month_acts==null?"":s.month_acts)+'" aria-label="Multistore '+esc(s.name)+'"></td><td><span class="pill" style="border:1px solid '+st[1]+';color:'+st[1]+'">'+st[0]+'</span></td></tr>';
  }).join("");
  return '<div class="kpis" style="margin-top:10px"><div class="kpi"><div class="v num" style="color:var(--moon)">$'+cash.toLocaleString("en-US")+'</div><div class="l">Bono de tienda proyectado</div></div><div class="kpi"><div class="v num">'+plat+' · '+gold+'</div><div class="l">Ruta Platinum · Gold</div></div></div>'+
   '<div class="card" style="margin-top:10px"><h2>Metas de tienda · día '+day+' de 30</h2><div class="tw"><table><thead><tr><th>Tienda</th><th>Act.</th><th>Proy.</th><th>Gold</th><th>Plat.</th><th>Multistore</th><th>Estado</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="sub" style="margin-top:8px"><b>Multistore:</b> escribe las activaciones del mes según el reporte y la app suma las que se registren después. Déjalo vacío para contar solo lo de la app. Los cambios se guardan al salir de la casilla.</div></div>';
}
function payRows(w){return standings(w);}
function adminPay(){
  var w=W.pay, st=payRows(w), tot=0, unv=0;
  var rows=st.map(function(c){tot+=c.pay.total;c.list.forEach(function(s){if(!s.verified)unv++;});return '<tr><td>'+esc(c.name)+'</td><td>'+c.d+'</td><td>'+c.perf+'%</td><td>'+money(c.pay.ap)+'</td><td>'+money(c.pay.act)+'</td><td>'+money(c.pay.edge)+'</td><td>'+money(c.pay.acc)+'</td><td><b>'+money(c.pay.total)+'</b></td></tr>';}).join("");
  return '<div style="margin-top:10px">'+weekChips("pay")+'</div><div class="card" style="margin-top:10px"><h2>Nómina · '+esc(WEEKS[w-1].t)+'</h2>'+
    (st.length?'<div class="tw"><table><thead><tr><th>Vendedor</th><th>Días</th><th>Rend.</th><th>Autopago</th><th>Activ.</th><th>Edge</th><th>Acces.</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Sin ventas esta semana.</div>')+
    '<div class="kpis" style="margin-top:10px"><div class="kpi"><div class="v num" style="color:var(--ok)">'+money(tot)+'</div><div class="l">Total a pagar</div></div><div class="kpi"><div class="v num" style="color:'+(unv?"var(--hot)":"var(--ok)")+'">'+unv+'</div><div class="l">Órdenes sin verificar</div></div></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn pri" id="csvPay">⬇ Nómina (CSV)</button><button class="btn" id="csvSales">⬇ Todas las ventas (CSV)</button></div></div>';
}
function adminAudit(){
  var q=auditQ.trim().toLowerCase();
  var list=adminRows.filter(function(r){return !q||(r.order_no+" "+r.seller+" "+r.store).toLowerCase().indexOf(q)>=0;});
  var unv=adminRows.filter(function(r){return !r.verified;}).length;
  return '<div class="card" style="margin-top:10px"><h2>Auditoría · '+adminRows.length+' órdenes</h2><div class="sub" style="margin:-6px 0 8px">'+unv+' sin verificar</div>'+
    '<input class="inp" id="aq" placeholder="Buscar orden, vendedor o tienda" value="'+esc(auditQ)+'">'+
    '<div style="display:flex;gap:8px;margin:8px 0"><button class="btn sm" id="vAll">✓ Verificar todas las visibles</button></div>'+
    (list.length?list.slice(0,200).map(function(r){return '<div class="sale"><div><b>#'+esc(r.order_no)+'</b> · '+esc(r.seller)+'<div class="sub">'+esc(fmtDate(r.date))+' · '+esc(r.store)+' · '+esc(items(r))+'</div></div><div class="acts">'+
      (r.verified?'<button class="btn sm" data-a="unverify" data-id="'+r.id+'" style="color:var(--ok)">✓ Verificada</button>':'<button class="btn sm" data-a="verify" data-id="'+r.id+'">Verificar</button>')+
      '<button class="btn sm red" data-a="remove" data-id="'+r.id+'" aria-label="Borrar orden '+esc(r.order_no)+'">Borrar</button></div></div>';}).join(""):'<div class="empty">Nada que mostrar.</div>')+'</div>';
}
function adminSellers(){
  var cnt={};sales.forEach(function(s){cnt[s.seller]=(cnt[s.seller]||0)+1;});
  return '<div class="card" style="margin-top:10px"><h2>Vendedores y PINs</h2><div style="display:flex;gap:8px"><input class="inp" id="newSeller" placeholder="Nombre y apellido"><button class="btn pri" id="addSeller">Agregar</button></div><div class="msg" id="smsg" style="margin-top:6px"></div>'+
    '<div style="display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap"><button class="btn sm" id="copyPins">📋 Copiar lista de PINs</button><button class="btn sm" id="csvPins">⬇ PINs (CSV)</button></div>'+
    sellers.map(function(s){return '<div class="sale"><div>'+esc(s.name)+'<div class="sub">PIN <b class="num" style="color:var(--moon);font-size:15px;letter-spacing:.1em">'+esc(adminPins[s.name]||"—")+'</b> · '+(cnt[s.name]||0)+' ventas'+(s.active?'':' · inactivo')+'</div></div><div class="acts"><button class="btn sm" data-np="'+esc(s.name)+'">Nuevo PIN</button>'+(s.active?'<button class="btn sm red" data-s="deactivate" data-n="'+esc(s.name)+'">Desactivar</button>':'<button class="btn sm" data-s="activate" data-n="'+esc(s.name)+'">Activar</button>')+'</div></div>';}).join("")+
    '<div class="sub" style="margin-top:8px">Cada vendedor entra con su nombre y su PIN. "Nuevo PIN" cambia el código y cierra la sesión en su celular la próxima vez que registre.</div></div>';
}
function csv(name,rows){
  var t=rows.map(function(r){return r.map(function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+t],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function bindAdmin(){
  var v=$("v-admin");
  [].forEach.call(v.querySelectorAll("tr[data-store] input"),function(inp){inp.onchange=async function(){
    var tr=inp.closest("tr"),name=tr.dataset.store,g=function(f){var x=tr.querySelector('[data-f="'+f+'"]').value.trim();return x===""?null:Math.max(0,parseInt(x,10)||0);};
    var s=await adminCall("mt_admin_store",{p_name:name,p_gold:g("gold"),p_plat:g("plat"),p_month_acts:g("ms")});
    if(s==="ok"){await loadAll();toast("Guardado: "+name);renderAdmin();}else{toast("No se pudo guardar");}
  };});
  bindWeeks(v,"pay",renderAdmin);
  if($("csvPay"))$("csvPay").onclick=function(){var w=W.pay,rows=[["Semana","Vendedor","Tienda","Dias","Rendimiento %","Autopagos","Activaciones","Accesorios $","Edge","Pago autopago","Pago activaciones","Pago Edge","Pago accesorios","Total"]];
    payRows(w).forEach(function(c){rows.push([w,c.name,c.store,c.d,c.perf,c.n.ap,c.n.act,c.n.acc.toFixed(2),c.n.edge,c.pay.ap.toFixed(2),c.pay.act.toFixed(2),c.pay.edge.toFixed(2),c.pay.acc.toFixed(2),c.pay.total.toFixed(2)]);});
    csv("mision-total-nomina-semana-"+w+".csv",rows);};
  if($("csvSales"))$("csvSales").onclick=function(){var rows=[["Fecha","Semana","Orden","Vendedor","Tienda","Plan","Lineas","Tablets","Home Internet","Autopagos","Edge","Accesorios $","Verificada","Registrada"]];
    adminRows.slice().reverse().forEach(function(r){rows.push([r.date,r.week,r.order_no,r.seller,r.store,r.plan||"",r.lines,(r.tabs||[]).join("+"),r.hi||"",r.autopay,r.edge,r.acc,r.verified?"Si":"No",new Date(r.created_at).toLocaleString("es-US",{timeZone:"America/New_York"})]);});
    csv("mision-total-ventas.csv",rows);};
  if($("aq"))$("aq").oninput=function(){auditQ=this.value;var pos=this.selectionStart;renderAdmin();var n=$("aq");n.focus();n.setSelectionRange(pos,pos);};
  [].forEach.call(v.querySelectorAll("[data-a]"),function(b){b.onclick=async function(){
    if(b.dataset.a==="remove"&&b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="¿Seguro?";return;}
    b.disabled=true;var s=await adminCall("mt_admin_sale",{p_id:b.dataset.id,p_action:b.dataset.a});
    if(s==="ok"){await Promise.all([adminLoad(),loadAll()]);renderAdmin();}else{toast("No se pudo");b.disabled=false;}
  };});
  if($("vAll"))$("vAll").onclick=async function(){var q=auditQ.trim().toLowerCase();var ids=adminRows.filter(function(r){return !r.verified&&(!q||(r.order_no+" "+r.seller+" "+r.store).toLowerCase().indexOf(q)>=0);}).map(function(r){return r.id;});
    if(!ids.length){toast("Nada pendiente");return;}this.disabled=true;this.textContent="Verificando "+ids.length+"…";
    for(var i=0;i<ids.length;i++)await adminCall("mt_admin_sale",{p_id:ids[i],p_action:"verify"});
    await Promise.all([adminLoad(),loadAll()]);toast("✓ "+ids.length+" verificadas");renderAdmin();};
  if($("addSeller"))$("addSeller").onclick=async function(){var n=$("newSeller").value.trim();if(n.length<2){$("smsg").className="msg err";$("smsg").textContent="Escribe el nombre.";return;}
    var s=await adminCall("mt_admin_seller",{p_name:n,p_action:"add"});if(s==="ok"){await Promise.all([loadAll(),adminLoad()]);toast("Agregado: "+n+" · PIN "+(adminPins[n]||""));renderAdmin();}else{$("smsg").className="msg err";$("smsg").textContent="No se pudo agregar.";}};
  [].forEach.call(v.querySelectorAll("[data-np]"),function(b){b.onclick=async function(){
    if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="¿Cambiar?";return;}
    var r=await sb.rpc("mt_admin_set_seller_pin",{p_pin:adminPin,p_name:b.dataset.np,p_new:null});
    if(!r.error&&r.data&&r.data.status==="ok"){adminPins[b.dataset.np]=r.data.pin;toast(b.dataset.np+": nuevo PIN "+r.data.pin);renderAdmin();}else toast("No se pudo");};});
  var pinList=function(){return sellers.filter(function(s){return s.active;}).map(function(s){return [s.name,adminPins[s.name]||""];});};
  if($("copyPins"))$("copyPins").onclick=async function(){var t="🚀 Misión Total · PINs\n"+pinList().map(function(r){return r[0]+": "+r[1];}).join("\n");
    try{await navigator.clipboard.writeText(t);toast("Lista copiada");}catch(e){toast("No se pudo copiar; usa el CSV");}};
  if($("csvPins"))$("csvPins").onclick=function(){csv("mision-total-pins.csv",[["Vendedor","PIN"]].concat(pinList()));};
  [].forEach.call(v.querySelectorAll("[data-s]"),function(b){b.onclick=async function(){var s=await adminCall("mt_admin_seller",{p_name:b.dataset.n,p_action:b.dataset.s});if(s==="ok"){await loadAll();renderAdmin();}else toast("No se pudo");};});
}

/* ---------- sesión del vendedor ---------- */
var ME=null;try{ME=JSON.parse(LS.get("mt-session")||"null");}catch(e){}
if(ME&&(!ME.name||!/^\d{4}$/.test(ME.pin||"")))ME=null;
resetF();
var loginName="";
function showLogin(msg){
  document.body.classList.add("locked");
  ["control","reg","me","admin"].forEach(function(v){$("v-"+v).hidden=true;});
  var L=$("v-login");L.hidden=false;
  var act=sellers.filter(function(s){return s.active;}).map(function(s){return s.name;});
  L.innerHTML='<div class="card login"><h2 style="margin:0">👨‍🚀 Entra a tu misión</h2>'+
    '<label class="fld">Tu nombre<select id="lgName"><option value="">Escoge tu nombre</option>'+act.map(function(n){return '<option'+(n===loginName?' selected':'')+'>'+esc(n)+'</option>';}).join("")+'</select></label>'+
    '<div class="pin" style="margin:4px auto 0"><div class="sub">Tu PIN de 4 dígitos</div><input id="lgPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="PIN"></div>'+
    '<div class="msg err" id="lgMsg" role="status" style="text-align:center">'+esc(msg||"")+'</div>'+
    '<div class="sub" style="text-align:center">¿No tienes PIN? Pídeselo a tu supervisor.</div></div>'+
    '<div style="text-align:center"><button type="button" class="linkbtn" id="lgAdmin">Entrar como administrador</button></div>';
  $("lgName").onchange=function(){loginName=this.value;$("lgMsg").textContent="";if(loginName)$("lgPin").focus();};
  $("lgPin").oninput=async function(){
    var v=this.value.replace(/\D/g,"");this.value=v;if(v.length!==4)return;
    var m=$("lgMsg");if(!loginName){m.textContent="Primero escoge tu nombre.";this.value="";return;}
    m.className="msg";m.textContent="Verificando…";
    var r=await sb.rpc("mt_seller_login",{p_name:loginName,p_pin:v});var s=r.error?"error":r.data.status;
    if(s==="ok"){ME={name:loginName,pin:v};LS.set("mt-session",JSON.stringify(ME));snd("level");enterApp("reg");return;}
    m.className="msg err";m.textContent={bad_pin:"PIN incorrecto.",locked:"Demasiados intentos. Espera 15 minutos.",no_pin:"No tienes PIN asignado. Pídeselo a tu supervisor.",bad_seller:"Ese nombre no está activo.",error:"Sin conexión. Intenta de nuevo."}[s]||"No se pudo entrar.";
    this.value="";
  };
  $("lgAdmin").onclick=function(){enterApp("admin");};
  syncExit();
}
function syncExit(){var b=$("exitBtn");var on=!document.body.classList.contains("locked")&&(ME||adminPin);b.hidden=!on;b.classList.remove("sure");b.textContent="⏏ Cerrar sesión";}
$("exitBtn").onclick=function(){var b=this;if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="¿Salir? Toca otra vez";clearTimeout(b._t);b._t=setTimeout(syncExit,3000);return;}
  adminPin=null;SS.set("mt-pin",null);adminRows=[];logout();};
function logout(msg){ME=null;try{localStorage.removeItem("mt-session");}catch(e){}resetF();showLogin(msg);}
function enterApp(v){
  document.body.classList.remove("locked");$("v-login").hidden=true;resetF();
  var b=document.querySelector('nav.tabs [data-v="'+v+'"]');b.click();syncExit();
}

/* ---------- instalar en el celular ---------- */
var deferredPrompt=null;
var standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;renderInstall();});
window.addEventListener("appinstalled",function(){LS.set("mt-installed","1");renderInstall();});
function renderInstall(){
  var box=$("installBox");
  if(standalone||LS.get("mt-install-hide")==="1"||LS.get("mt-installed")==="1"){box.innerHTML="";return;}
  var how=deferredPrompt?'<button type="button" class="btn pri" id="instBtn">📲 Instalar app</button>':
    isIOS?'En Safari toca <b>Compartir ⬆️</b> y luego <b>“Agregar a pantalla de inicio”</b>.':
    'En Chrome toca el menú <b>⋮</b> y luego <b>“Agregar a la pantalla principal”</b> o <b>“Instalar app”</b>.';
  box.innerHTML='<div class="install"><div class="row"><span>🚀 <b>Pon Misión Total en tu pantalla</b></span><button type="button" class="linkbtn" id="instHide" aria-label="Ocultar">✕</button></div><div>'+how+'</div></div>';
  $("instHide").onclick=function(){LS.set("mt-install-hide","1");renderInstall();};
  if($("instBtn"))$("instBtn").onclick=async function(){deferredPrompt.prompt();var c=await deferredPrompt.userChoice;deferredPrompt=null;if(c.outcome==="accepted")LS.set("mt-installed","1");renderInstall();};
}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});

/* ---------- navegación y carga ---------- */
var view="control";
var R={control:renderControl,reg:renderReg,me:renderMe,admin:renderAdmin};
[].forEach.call(document.querySelectorAll("nav.tabs [data-v]"),function(b){b.onclick=async function(){
  view=b.dataset.v;
  [].forEach.call(document.querySelectorAll("nav.tabs [data-v]"),function(x){x.setAttribute("aria-selected",x===b?"true":"false");});
  ["control","reg","me","admin"].forEach(function(v){$("v-"+v).hidden=v!==view;});
  if(view==="admin"&&adminPin&&!adminRows.length)await adminLoad();
  R[view]();window.scrollTo(0,0);
};});
function setNet(ok){online=ok;var n=$("net");n.className="net "+(ok?"on":"off");n.textContent=ok?"● En vivo":"● Sin conexión";}
async function loadAll(){
  try{
    var r=await Promise.all([sb.from("mt_sales").select(COLS).order("created_at",{ascending:false}).limit(10000),sb.from("mt_sellers").select("name,active").order("name"),sb.from("mt_stores").select("name,sort,gold,plat,month_acts,month_acts_at").order("sort")]);
    if(r[0].error||r[1].error||r[2].error)throw 0;
    sales=r[0].data.map(function(s){s.acc=Number(s.acc)||0;s.tabs=s.tabs||[];return s;});sellers=r[1].data;stores=r[2].data;setNet(true);return true;
  }catch(e){setNet(false);return false;}
}
function busy(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT");}
async function refresh(){await loadAll();if(document.body.classList.contains("locked"))return;if(view==="reg"){if(!busy())renderUndo();return;}if(view==="admin"){if(busy())return;if(adminPin)await adminLoad();}R[view]();}
(async function init(){
  if(!window.supabase){setNet(false);$("v-control").innerHTML='<div class="card empty">No se pudo cargar la app. Revisa tu internet y recarga.</div>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  $("v-control").innerHTML='<div class="card empty">Cargando misión…</div>';
  renderInstall();
  await loadAll();
  if(ME){var r=await sb.rpc("mt_seller_login",{p_name:ME.name,p_pin:ME.pin});var s=r.error?"error":r.data.status;
    if(s==="bad_pin"||s==="no_pin"||s==="bad_seller"){logout("Tu PIN cambió. Entra de nuevo.");return;}}
  if(!ME&&!adminPin){showLogin();}
  else{if(adminPin)await adminLoad();renderControl();}
  syncExit();
  setInterval(refresh,45000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh();});
})();
})();
</script>
</body>
</html>
